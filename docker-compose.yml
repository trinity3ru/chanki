services:
  site-monitor:
    build: .
    container_name: chanki-site-monitor
    restart: unless-stopped

    environment:
      # Токен бота подставляется из .env рядом с этим файлом
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN не задан в .env}

      # Прокси для Telegram, если api.telegram.org недоступен с сервера напрямую.
      # Пусто - идем напрямую. Проверки сайтов через прокси не ходят в любом случае
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}

      # Таймауты соединения с Telegram (секунды)
      - CONNECT_TIMEOUT=${CONNECT_TIMEOUT:-20}
      - READ_TIMEOUT=${READ_TIMEOUT:-20}

      # Дополнительные настройки (опционально)
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-6}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-10}
      - MIN_CONTENT_LENGTH=${MIN_CONTENT_LENGTH:-100}
      - ERROR_RETRY_DELAY_SECONDS=${ERROR_RETRY_DELAY_SECONDS:-30}

      # Пути к файлам в контейнере (лежат в именованных volume'ах)
      - SITES_DATABASE_FILE=/app/data/sites.json
      - SNAPSHOTS_DIR=/app/data/snapshots
      - LOG_FILE=/app/logs/monitor.log

    volumes:
      # Только собственные volume'ы проекта, каталог с кодом и .env в контейнер не пробрасываем
      - chanki-data:/app/data
      - chanki-logs:/app/logs

    # Порты НЕ публикуем: бот работает через long polling и web-интерфейса не имеет.
    # На хосте 80/443 заняты Nginx Proxy Manager, трогать их нельзя.

    # Настройки для безопасности
    security_opt:
      - no-new-privileges:true

    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.2'

    # Чтобы логи контейнера не съели диск на общем сервере
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Проверяем доступность Telegram тем же путем, каким ходит бот:
    # напрямую или через прокси, иначе статус врал бы при работе через прокси
    healthcheck:
      test: ["CMD", "python", "-c", "import os, requests; p = os.getenv('TELEGRAM_PROXY_URL'); requests.get('https://api.telegram.org', timeout=10, proxies={'http': p, 'https': p} if p else None)"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 60s

    # Собственная сеть проекта, к существующим сетям не подключаемся
    networks:
      - chanki-net

volumes:
  chanki-data:
  chanki-logs:

networks:
  chanki-net:
    driver: bridge
